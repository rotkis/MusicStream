<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Vibes</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

    <!-- HEADER -->
    <header class="header">
        <div class="logo-area">
    <span class="logo">Vibes</span>
    <button class="upload-btn" onclick="irUpload()">Upload</button>
        </div>
        <input type="text" placeholder="Buscar músicas, artistas..." id="busca">
        <div class="user">👤</div>
    </header>

    <!-- BANNER -->
    <section class="banner">        
        <div class="banner-content">
            <h1>Escute o que te move</h1>
            <button>▶ Reproduzir Agora</button>
        </div>
    </section>

    <!-- PLAYLISTS -->
    <section class="section">
        <h2>🎵 Playlists Populares</h2>

        <div class="cards" id="lista-playlists">
            <!-- JS preenche -->
        </div>
    </section>

</div>



<section class="section">
    <h2>🎵 Todas as músicas</h2>
    <div class="cards" id="lista-musicas"></div>
</section>

<section class="section">
    <h2>🔥 Top mais ouvidas</h2>
    <div class="cards" id="top-musicas"></div>
</section>

<section class="section">
    <h2>📂 Minhas playlists</h2>
    <div class="cards" id="playlists"></div>
</section>

<!-- PLAYER -->
<footer class="player">
    <div class="music-info">
        <div class="cover"></div>
        <div>
            <p id="nome-musica">Electric Dreams</p>
            <span>Midnight Pulse</span>
        </div>
    </div>

    <div class="controls">
        <button onclick="tocar()">▶</button>
    </div>
</footer>

<button onclick="window.location.href='minhas-musicas.html'">
    🎵 Minhas Músicas
</button>

<script src="js/home.js"></script>
</body>
</html>
