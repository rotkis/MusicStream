<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minhas Playlists - Vibes</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

    <!-- HEADER -->
    <header class="header">

        <div class="logo-area">
            <span class="logo">Vibes</span>

            <button class="upload-btn"
                onclick="window.location.href='upload.html'">
                Upload
            </button>
        </div>

        <input type="text"
            id="busca"
            placeholder="Buscar playlists...">

        <div class="user">
            👤
        </div>

    </header>

    <!-- TÍTULO -->
    <section class="section">
        <h1>📂 Minhas Playlists</h1>

        <div class="playlist-grid"
            id="lista-playlists">
        </div>
    </section>

</div>

<script src="js/api.js"></script>
<script src="js/playlists.js"></script>

</body>
</html>
