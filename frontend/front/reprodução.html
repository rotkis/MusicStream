<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Reprodução - Vibes</title>
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="player-page">

    <!-- TOPO -->
    <header class="player-header">

        <button onclick="voltar()">←</button>

        <h2>Tocando Agora</h2>

    </header>

    <!-- CAPA -->
    <div class="player-cover"></div>

    <!-- INFO -->
    <div class="player-info">

        <h1 id="titulo">
            Electric Dreams
        </h1>

        <p id="artista">
            Midnight Pulse
        </p>

    </div>

    <!-- BARRA -->
    <div class="progress-area">

        <span id="tempo-atual">
            0:00
        </span>

        <input
            type="range"
            id="progress"
            value="0"
            min="0"
            max="100"
        >

        <span id="tempo-total">
            3:45
        </span>

    </div>

    <!-- CONTROLES -->
    <div class="controls">

        <button onclick="anterior()">
            ⏮
        </button>

        <button
            class="play-btn"
            onclick="togglePlay()"
            id="playBtn"
        >
            ▶
        </button>

        <button onclick="proxima()">
            ⏭
        </button>

    </div>

</div>

<script src="js/player.js"></script>

</body>
</html>
