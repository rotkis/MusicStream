server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Redireciona qualquer rota para o index.html
    # Necessário para o React Router funcionar (sem isso /home dá 404)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy para o backend — evita CORS em produção
    # Toda chamada para /api/* é redirecionada para o backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
